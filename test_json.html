<!DOCTYPE html>
<html>
<head>
    <title>JSON Test</title>
</head>
<body>
    <h1>JSON Loading Test</h1>
    <div id="result"></div>
    
    <script>
        async function testJSON() {
            const resultDiv = document.getElementById('result');
            
            try {
                console.log('Attempting to load JSON...');
                const response = await fetch('test.json');
                console.log('Response status:', response.status);
                console.log('Response ok:', response.ok);
                
                // Get the raw text first and check its content
                const rawText = await response.text();
                console.log('First few bytes:', [...rawText].slice(0, 10).map(c => c.charCodeAt(0)));
                
                // Parse the text into JSON
                const data = JSON.parse(rawText);
                console.log('Data loaded successfully');
                console.log('Number of entities:', data.length);
                console.log('First entity:', data[0]);
                
                resultDiv.innerHTML = `
                    <h2>✅ Success!</h2>
                    <p>Loaded ${data.length} entities</p>
                    <p>First entity: ${data[0].entity}</p>
                    <p>UHT Code: ${data[0].uht_code}</p>
                `;
                
            } catch (error) {
                console.error('Error loading JSON:', error);
                console.error('Error details:', {
                    name: error.name,
                    message: error.message,
                    stack: error.stack
                });
                resultDiv.innerHTML = `
                    <h2>❌ Error</h2>
                    <p>${error.name}: ${error.message}</p>
                    <p>Check the browser console for more details.</p>
                    <p>This might be a CORS issue when loading local files.</p>
                    <p>Try opening this file through a local server instead of directly.</p>
                `;
            }
        }
        
        testJSON();
    </script>
</body>
</html>
